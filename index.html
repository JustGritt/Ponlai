<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lighthouse</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 13px/1.4 system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #ccc; background: #000; transition: opacity 0.6s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #hud { position: fixed; left: 16px; bottom: 16px; color: #e8e6e0; background: rgba(10, 14, 20, 0.55); padding: 10px 12px; border-radius: 8px;
      backdrop-filter: blur(6px); user-select: none; max-width: calc(100vw - 56px); }
    #hud p { margin: 0 0 8px; opacity: 0.85; }
    #hud .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #hud button { font: inherit; color: inherit; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
      padding: 4px 10px; cursor: pointer; }
    #hud button:hover { background: rgba(255, 255, 255, 0.2); }
    #count { margin-left: 6px; opacity: 0.7; font-variant-numeric: tabular-nums; }
    #scenes a { color: inherit; opacity: 0.85; margin-left: 6px; }
    #scenes a:hover { opacity: 1; }
    #setup { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 16px; background: #000; color: #e8e6e0; }
    #setup[hidden] { display: none; }
    #setup form { width: min(340px, 100%); display: grid; gap: 18px; }
    #setup h1 { margin: 0; font-size: 22px; font-weight: 600; }
    #setup fieldset { margin: 0; padding: 0; border: 0; display: flex; gap: 6px; }
    #setup legend { margin-bottom: 6px; opacity: 0.7; }
    #setup label { position: relative; flex: 1; text-align: center; padding: 9px 0; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
      background: rgba(255, 255, 255, 0.06); cursor: pointer; }
    #setup label:has(:checked) { background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.55); }
    #setup label:has(:focus-visible) { outline: 2px solid #9cc4ff; outline-offset: 2px; }
    #setup input { position: absolute; opacity: 0; pointer-events: none; }
    #setup p { margin: 0; opacity: 0.8; }
    #setup p:empty { display: none; }
    #setup p.warn { color: #ffb38a; opacity: 1; }
    #setup button { font: inherit; font-size: 15px; padding: 10px; color: #111; background: #e8e6e0; border: 0; border-radius: 6px; cursor: pointer; }
    #setup button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Loading…</div>
  <div id="hud">
    <p id="help"></p>
    <div class="row">
      <button data-preset="noon">Noon</button>
      <button data-preset="sunset">Sunset</button>
      <button data-preset="dusk">Dusk</button>
      <button data-preset="midnight">Midnight</button>
      <button id="sound" aria-pressed="true">Sound: on</button>
      <span id="count"></span>
      <span id="scenes"></span>
    </div>
  </div>
  <div id="setup" hidden>
    <form>
      <h1 id="setup-title">Lighthouse</h1>
      <fieldset>
        <legend>Graphics</legend>
        <label><input type="radio" name="tier" value="low" required /> Low</label>
        <label><input type="radio" name="tier" value="medium" /> Medium</label>
        <label><input type="radio" name="tier" value="high" /> High</label>
      </fieldset>
      <fieldset>
        <legend>Frame rate</legend>
        <label><input type="radio" name="fps" value="0" required /> Full</label>
        <label><input type="radio" name="fps" value="30" /> 30 fps</label>
      </fieldset>
      <p id="setup-note"></p>
      <button type="submit">Start</button>
    </form>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
